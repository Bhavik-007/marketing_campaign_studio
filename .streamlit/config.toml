[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseRadius = "0.65rem"
buttonRadius = "0.55rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.25rem"
paddingBottom = "2rem"
headingFontSizes = ["2.15rem", "1.55rem", "1.25rem", "1.05rem", "0.95rem", "0.85rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "1.35rem"
metricValueFontWeight = 700
linkUnderline = false

[theme.light]
primaryColor = "#156F6A"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF4F3"
textColor = "#173042"
borderColor = "#D8E3E6"
codeBackgroundColor = "#EEF4F3"
dataframeHeaderBackgroundColor = "#173042"
dataframeHeaderTextColor = "#FFFFFF"
chartCategoricalColors = ["#156F6A", "#2979A5", "#B7791F", "#7A5AF8", "#D65353", "#2F855A"]

[theme.light.sidebar]
backgroundColor = "#123245"
secondaryBackgroundColor = "#1B4358"
codeBackgroundColor = "#1B4358"
textColor = "#F1F7F8"
borderColor = "#315B6B"
primaryColor = "#4FD1C5"
linkColor = "#9AE6E0"

[theme.dark]
primaryColor = "#4FD1C5"
backgroundColor = "#10232E"
secondaryBackgroundColor = "#173542"
textColor = "#EDF7F8"
borderColor = "#31515D"
codeBackgroundColor = "#173542"
dataframeHeaderBackgroundColor = "#1B4358"
dataframeHeaderTextColor = "#FFFFFF"
chartCategoricalColors = ["#4FD1C5", "#63B3ED", "#F6C15A", "#B9A4FF", "#FC8181", "#68D391"]

[theme.dark.sidebar]
backgroundColor = "#0B1A22"
secondaryBackgroundColor = "#102A36"
codeBackgroundColor = "#102A36"
textColor = "#EDF7F8"
borderColor = "#294A56"
primaryColor = "#4FD1C5"
linkColor = "#9AE6E0"
